<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>しくみ動画(元)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=M+PLUS+1+Code:wght@500;700&display=swap">
<script src="out/timing.js"></script>
<style>
:root{--bg:#0b1430;--grid:#15244a;--panel:#12204a;--edge:#2f4c8a;--ink:#eef3ff;--dim:#8fa3cf;
  --blue:#4f9bff;--amber:#ffb23e;--green:#3ddc97;--red:#ff5d5d;--violet:#b58cff;--pink:#ff5fa2}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;color:var(--ink);position:relative;
  background-image:radial-gradient(ellipse at 50% 35%,rgba(79,155,255,.13),transparent 60%),linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);
  background-size:100% 100%,54px 54px,54px 54px}
.mono{font-family:"M PLUS 1 Code",monospace}
#bar{position:absolute;top:70px;left:70px;right:70px;height:8px;background:rgba(255,255,255,.08);border-radius:4px}
#bar i{display:block;height:100%;width:0;border-radius:4px}
#tag{position:absolute;top:104px;left:70px;right:260px;font-size:30px;font-weight:500;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#no{position:absolute;top:104px;right:70px;font-size:30px;font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}
#title{position:absolute;top:220px;left:40px;right:40px;text-align:center;font-weight:800;font-size:96px;line-height:1.3}
#title span{display:block}
#title b{color:var(--acc)}
#sub{position:absolute;left:50px;right:50px;top:1585px;display:flex;justify-content:center}
#sub p{background:rgba(5,10,28,.8);border:2px solid rgba(143,163,207,.25);border-radius:22px;padding:20px 32px;font-size:44px;font-weight:800;line-height:1.5;text-align:center}
#art{position:absolute;left:0;top:600px;width:1080px;height:960px}
.a{position:absolute}
.node{position:absolute;background:var(--panel);border:5px solid var(--c,var(--edge));border-radius:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:800;font-size:42px;text-align:center;line-height:1.25;padding:10px}
.node.small{font-size:32px}
.node small{display:block;font-size:27px;font-weight:500;color:var(--dim)}
.chip{position:absolute;display:inline-flex;align-items:center;padding:14px 28px;border-radius:999px;font-size:36px;font-weight:800;background:var(--panel);border:4px solid var(--c,var(--edge));white-space:nowrap}
#dot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 10px rgba(255,178,62,.25),0 0 40px rgba(255,178,62,.8)}
#dotl{position:absolute;transform:translate(-50%,-108px);font-size:30px;padding:8px 20px;border-color:var(--amber)}
/* list */
.list{position:absolute;left:60px;right:60px;top:20px;display:flex;flex-direction:column;gap:26px}
.list.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px;top:10px}
.it{position:relative;background:var(--panel);border-left:12px solid var(--c,var(--edge));border-radius:16px;padding:22px 30px}
.it b{display:block;font-size:44px;font-weight:800;line-height:1.3}
.it.m b{font-family:"M PLUS 1 Code",monospace;font-weight:700;font-size:40px}
.it span{display:block;font-size:31px;font-weight:500;color:var(--dim);margin-top:6px;line-height:1.4}
.list.compact{gap:14px}
.list.compact .it{padding:14px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.list.compact .it b{font-size:31px}
.list.compact .it span{margin:0;font-size:30px;white-space:nowrap;color:var(--ink)}
.list.cols .it{padding:18px 24px}
.list.cols .it b{font-size:36px}
/* code */
.code{position:absolute;left:30px;right:30px;top:0;background:#070d22;border:4px solid var(--edge);border-radius:24px;overflow:hidden}
.code h5{font-size:28px;font-weight:500;color:var(--dim);padding:16px 28px;border-bottom:3px solid var(--edge);background:#0e1838}
.code pre{font-family:"M PLUS 1 Code",monospace;font-size:31px;line-height:1;padding:18px 0}
.code .ln{display:flex;height:60px;align-items:center;transition:none;white-space:pre}
.code .ln i{font-style:normal;width:70px;text-align:right;padding-right:22px;color:#4a5f92;flex:none}
.code .ln.on{background:rgba(255,178,62,.18);box-shadow:inset 8px 0 0 var(--amber)}
/* table */
.tbl{position:absolute;background:var(--panel);border:4px solid var(--edge);border-radius:20px;overflow:hidden}
.tbl h4{font-size:34px;padding:12px 22px;background:rgba(61,220,151,.14);display:flex;justify-content:space-between;align-items:baseline}
.tbl h4 small{font-size:26px;color:var(--dim);font-weight:500}
.tbl div{font-family:"M PLUS 1 Code",monospace;font-size:25px;padding:6px 22px;border-top:2px solid rgba(143,163,207,.14);white-space:nowrap}
.tbl div.mk{color:var(--amber);font-weight:700}
.tbl.on{border-color:var(--green);box-shadow:0 0 60px rgba(61,220,151,.35)}
/* compare */
.col{position:absolute;top:20px;width:470px;background:var(--panel);border:5px solid var(--c);border-radius:30px;padding:30px 30px 34px}
.col h3{font-size:46px;font-weight:800}
.col h3 small{display:block;font-size:27px;font-weight:500;color:var(--dim);margin-top:4px}
.col p{font-size:36px;font-weight:500;margin-top:24px;padding-top:20px;border-top:2px solid rgba(143,163,207,.2);line-height:1.4}
/* big */
.bigt{position:absolute;left:30px;right:30px;top:30px;text-align:center;font-size:88px;font-weight:800;line-height:1.25}
.bigt.mono{font-size:76px}
.bigs{position:absolute;left:30px;right:30px;top:170px;text-align:center;font-size:40px;font-weight:500;color:var(--dim)}
.bigc{position:absolute;left:40px;right:40px;top:330px;display:flex;flex-direction:column;align-items:center;gap:30px}
.bigc .chip{position:relative}
/* card */
.cardq{position:absolute;left:50px;right:50px;top:0;background:var(--panel);border:5px solid var(--amber);border-radius:32px;padding:40px 44px}
.cardq .k{display:inline-block;background:var(--amber);color:#0b1430;font-weight:800;font-size:40px;border-radius:14px;padding:4px 22px;margin-bottom:18px}
.cardq b{display:block;font-size:56px;line-height:1.4}
.carda{position:absolute;left:50px;right:50px;top:400px;background:#0e2a26;border:5px solid var(--green);border-radius:32px;padding:40px 44px}
.carda .k{display:inline-block;background:var(--green);color:#0b1430;font-weight:800;font-size:40px;border-radius:14px;padding:4px 22px;margin-bottom:18px}
.carda b{display:block;font-size:42px;line-height:1.55;font-weight:800}
/* chapter */
.chn{position:absolute;left:0;right:0;top:-260px;text-align:center;font-size:44px;font-weight:800;color:var(--acc);letter-spacing:.2em}
.chbig{position:absolute;left:0;right:0;top:-170px;text-align:center;font-size:330px;font-weight:800;color:var(--acc);line-height:1;opacity:.95}
.chname{position:absolute;left:40px;right:40px;top:300px;text-align:center;font-size:92px;font-weight:800;line-height:1.3;white-space:pre-line}
.chline{position:absolute;left:340px;right:340px;top:250px;height:8px;border-radius:4px;background:var(--acc)}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="tag"></div>
<div id="no"></div>
<div id="title"></div>
<div id="art"></div>
<div id="sub"><p></p></div>

<script>
const T = window.TIMING;
const COL = { blue: "#4f9bff", amber: "#ffb23e", green: "#3ddc97", red: "#ff5d5d", violet: "#b58cff", pink: "#ff5fa2" };
const col = c => COL[c] || c || "#2f4c8a";
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const ICON = {
  phone: s => `<svg width="${s*.62}" height="${s}" viewBox="0 0 62 100"><rect x="4" y="4" width="54" height="92" rx="12" fill="#1c2f63" stroke="#4f9bff" stroke-width="6"/><rect x="22" y="12" width="18" height="5" rx="2.5" fill="#4f9bff"/></svg>`,
  cloud: s => `<svg width="${s*1.4}" height="${s}" viewBox="0 0 140 100"><path d="M36 86h70a26 26 0 0 0 0-52 36 36 0 0 0-68-6A28 28 0 0 0 36 86z" fill="#2a2a1c" stroke="#ffb23e" stroke-width="7" stroke-linejoin="round"/></svg>`,
  db: s => `<svg width="${s*.8}" height="${s}" viewBox="0 0 80 100"><path d="M6 18v64c0 9 15 14 34 14s34-5 34-14V18" fill="#123a33" stroke="#3ddc97" stroke-width="6"/><ellipse cx="40" cy="18" rx="34" ry="12" fill="#1a5246" stroke="#3ddc97" stroke-width="6"/><path d="M6 50c0 9 15 14 34 14s34-5 34-14" fill="none" stroke="#3ddc97" stroke-width="6"/></svg>`,
  ai: s => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><path d="M50 4c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46C30 46 46 30 50 4z" fill="#2c2050" stroke="#b58cff" stroke-width="6" stroke-linejoin="round"/></svg>`,
  cam: s => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><rect x="6" y="6" width="88" height="88" rx="26" fill="#3a1630" stroke="#ff5fa2" stroke-width="7"/><circle cx="50" cy="50" r="20" fill="none" stroke="#ff5fa2" stroke-width="7"/><circle cx="74" cy="26" r="6" fill="#ff5fa2"/></svg>`,
  pc: s => `<svg width="${s*1.2}" height="${s}" viewBox="0 0 120 100"><rect x="6" y="6" width="108" height="68" rx="8" fill="#1c2f63" stroke="#4f9bff" stroke-width="6"/><path d="M44 74v14M76 74v14M32 92h56" stroke="#4f9bff" stroke-width="6" stroke-linecap="round"/></svg>`,
  clock: s => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#2a2a1c" stroke="#ffb23e" stroke-width="7"/><path class="hand" d="M50 50V20" stroke="#ffb23e" stroke-width="7" stroke-linecap="round"/><path d="M50 50h20" stroke="#ffb23e" stroke-width="7" stroke-linecap="round"/></svg>`,
  git: s => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="30" cy="22" r="12" fill="none" stroke="#3ddc97" stroke-width="7"/><circle cx="30" cy="78" r="12" fill="none" stroke="#3ddc97" stroke-width="7"/><circle cx="72" cy="40" r="12" fill="none" stroke="#3ddc97" stroke-width="7"/><path d="M30 34v32M72 52c0 16-26 12-38 18" fill="none" stroke="#3ddc97" stroke-width="7"/></svg>`,
  mail: s => `<svg width="${s*1.3}" height="${s}" viewBox="0 0 130 100"><rect x="6" y="10" width="118" height="80" rx="12" fill="#1c2f63" stroke="#4f9bff" stroke-width="7"/><path d="M12 18l53 40 53-40" fill="none" stroke="#4f9bff" stroke-width="7" stroke-linejoin="round"/></svg>`,
  bell: s => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><path d="M50 8a8 8 0 0 1 8 8v3c14 4 22 16 22 32v18l10 12H10l10-12V51c0-16 8-28 22-32v-3a8 8 0 0 1 8-8z" fill="#2a2a1c" stroke="#ffb23e" stroke-width="6" stroke-linejoin="round"/><path d="M38 86a12 12 0 0 0 24 0" fill="none" stroke="#ffb23e" stroke-width="6"/></svg>`,
  lock: s => `<svg width="${s*.86}" height="${s}" viewBox="0 0 86 100"><path d="M20 44V30a23 23 0 0 1 46 0v14" fill="none" stroke="#ff5d5d" stroke-width="8"/><rect x="6" y="44" width="74" height="50" rx="12" fill="#3a1820" stroke="#ff5d5d" stroke-width="7"/><circle cx="43" cy="68" r="7" fill="#ff5d5d"/></svg>`,
  folder: s => `<svg width="${s*1.2}" height="${s}" viewBox="0 0 120 100"><path d="M6 20a8 8 0 0 1 8-8h30l12 12h50a8 8 0 0 1 8 8v52a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8z" fill="#123a33" stroke="#3ddc97" stroke-width="7" stroke-linejoin="round"/></svg>`,
  user: s => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="50" cy="32" r="20" fill="#3a1630" stroke="#ff5fa2" stroke-width="7"/><path d="M12 94c4-22 20-34 38-34s34 12 38 34z" fill="#3a1630" stroke="#ff5fa2" stroke-width="7" stroke-linejoin="round"/></svg>`
};
const appear = (at, d) => `data-at="${at ?? -1}" data-d="${d || 0}"`;

// ---------- 場面の種類ごとに中身を作る ----------
const BUILD = {
  chapter(s) {
    return `<div class="chline" data-at="-1" data-d=".2"></div>
      <div class="chn" data-at="-1">CHAPTER</div>
      <div class="chbig" data-at="-1" data-d=".1">${s.data.no}</div>
      <div class="chname" data-at="-1" data-d=".35">${esc(s.data.name)}</div>`;
  },
  big(s) {
    const d = s.data;
    return `<div class="bigt ${d.mono ? "mono" : ""}" data-at="-1">${esc(d.text)}</div>
      ${d.sub ? `<div class="bigs" data-at="-1" data-d=".3">${esc(d.sub)}</div>` : ""}
      <div class="bigc">${(d.chips || []).map(c => `<div class="chip" style="--c:${col(c.color)}" ${appear(c.at, c.d)}>${esc(c.text)}</div>`).join("")}</div>`;
  },
  list(s) {
    const d = s.data;
    return `<div class="list ${d.cols ? "cols" : ""} ${d.compact ? "compact" : ""}">${d.items.map(it =>
      `<div class="it ${it.mono ? "m" : ""}" style="--c:${col(it.color)}" ${appear(it.at, it.d)}><b>${esc(it.text)}</b>${it.sub ? `<span>${esc(it.sub)}</span>` : ""}</div>`).join("")}</div>`;
  },
  code(s) {
    const d = s.data;
    return `<div class="code" data-at="-1"><h5>${esc(d.file)}</h5><pre>${d.code.map((l, i) =>
      `<div class="ln" data-ln="${i + 1}"><i>${i + 1}</i>${esc(l) || " "}</div>`).join("")}</pre></div>`;
  },
  diagram(s) {
    const d = s.data;
    const byId = Object.fromEntries(d.nodes.map(n => [n.id, n]));
    const c = n => [n.x + n.w / 2, n.y + n.h / 2];
    const edges = (d.edges || []).map(e => {
      const [x1, y1] = c(byId[e.from]), [x2, y2] = c(byId[e.to]);
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${appear(e.at, e.d)}/>`;
    }).join("");
    return `<svg class="a" width="1080" height="960" style="left:0;top:0"><g stroke="#3b5aa0" stroke-width="8" stroke-dasharray="4 18" stroke-linecap="round" fill="none">${edges}</g></svg>
      ${d.nodes.map(n => `<div class="node ${n.small ? "small" : ""}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;--c:${col(n.color)}" ${appear(n.at, n.d)}>
        ${n.icon ? ICON[n.icon](n.h > 230 ? 84 : 66) : ""}<div>${esc(n.label)}${n.sub ? `<small>${esc(n.sub)}</small>` : ""}</div></div>`).join("")}
      ${(d.chips || []).map(ch => `<div class="chip" style="left:${ch.x}px;top:${ch.y}px;--c:${col(ch.color)}" ${appear(ch.at, ch.d)}>${esc(ch.text)}</div>`).join("")}
      ${d.routes ? `<div id="dot" style="opacity:0"></div><div class="chip" id="dotl" style="opacity:0"></div>` : ""}`;
  },
  table(s) {
    const d = s.data;
    return d.tables.map(t => `<div class="tbl" data-t="${t.name}" style="left:${t.x}px;top:${t.y}px;width:${t.w}px" ${appear(t.at, t.d)}>
      <h4><span class="mono">${t.name}</span><small>${t.ja}</small></h4>
      ${t.cols.map(c => `<div class="${c === d.mark ? "mkc" : ""}">${c}</div>`).join("")}</div>`).join("");
  },
  compare(s) {
    const d = s.data;
    const side = (o, x) => `<div class="col" style="left:${x}px;--c:${col(o.color)}" ${appear(o.at)}>
      <h3>${esc(o.head)}${o.sub ? `<small class="mono">${esc(o.sub)}</small>` : ""}</h3>
      ${o.items.map((it, i) => `<p ${appear(o.itemAt ? o.itemAt[i] : o.at, o.itemAt ? 0 : .3 + i * .3)}>${esc(it)}</p>`).join("")}</div>`;
    return side(d.left, 50) + side(d.right, 560) +
      (d.note ? `<div class="chip" style="left:50px;right:50px;top:720px;white-space:normal;line-height:1.4;border-radius:26px;--c:${col(d.note.color)}" ${appear(d.note.at)}>${esc(d.note.text)}</div>` : "");
  },
  card(s) {
    const d = s.data;
    return `<div class="cardq" data-at="-1"><span class="k">Q${d.n ? " " + d.n : ""}</span><b>${esc(d.q)}</b></div>
      <div class="carda" data-at="1"><span class="k">A</span><b>${esc(d.a)}</b></div>`;
  }
};

// 章の名前を、各場面に配る
let chap = T.title || "";
T.scenes.forEach(s => {
  if (s.type === "chapter") chap = `第${s.data.no}章 ${s.data.name.replace(/\n/g, " ")}`;
  s.chap = chap;
});

const art = document.getElementById("art");
const titleEl = document.getElementById("title");
const subBox = document.getElementById("sub");
const subEl = subBox.querySelector("p");
const barEl = document.querySelector("#bar i");
const tagEl = document.getElementById("tag");
const noEl = document.getElementById("no");
const clamp = x => x < 0 ? 0 : x > 1 ? 1 : x;
const ease = x => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const back = x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
let cur = null, items = [];

function mount(s) {
  art.innerHTML = BUILD[s.type](s);
  titleEl.innerHTML = s.type === "chapter" || s.type === "card" && !s.title ? "" : (s.title || []).map(x => `<span>${x}</span>`).join("");
  if (s.type === "card" && !s.title) titleEl.innerHTML = s.data.n ? `<span>想定質問</span>` : `<span>聞かれたら</span>`;
  const acc = col(s.acc);
  document.body.style.setProperty("--acc", acc);
  barEl.style.background = acc;
  tagEl.textContent = s.chap;
  items = [...art.querySelectorAll("[data-at]")];
  cur = s;
}

window.render = function (t) {
  const s = T.scenes.find(x => t >= x.start && t < x.end) || T.scenes[T.scenes.length - 1];
  if (cur !== s) mount(s);
  const lt = t - s.start;
  const L = s.lines.map(l => ({ s: l.start - s.start, e: l.end - s.start }));
  const fade = Math.min(clamp(lt / .35), clamp((s.end - t) / .3));
  art.style.opacity = fade;
  titleEl.style.opacity = fade;
  titleEl.style.transform = `translateY(${(1 - back(lt / .55)) * 50}px)`;
  barEl.style.width = (t / T.total * 100) + "%";
  const m = Math.floor(t / 60), sec = Math.floor(t % 60);
  noEl.textContent = `${m}:${String(sec).padStart(2, "0")}`;

  for (const el of items) {
    const k = +el.dataset.at, d = +el.dataset.d;
    const base = k < 0 ? .1 : (L[k] ? L[k].s : 0);
    const p = clamp((lt - base - d) / .45);
    el.style.opacity = ease(p);
    if (el.tagName !== "line") el.style.translate = `0 ${(1 - back(p)) * 36}px`;
  }

  // 今どの行を話しているか
  let li = -1;
  for (let i = 0; i < L.length; i++) if (lt >= L[i].s - .1) li = i;

  if (s.type === "code") {
    const hl = (s.data.hl || [])[li] || [];
    art.querySelectorAll(".ln").forEach(el => {
      const on = hl.includes(+el.dataset.ln);
      el.classList.toggle("on", on);
      el.style.opacity = hl.length && !on ? .4 : 1;
    });
  }
  if (s.type === "table") {
    const f = (s.data.focus || [])[li] || [];
    art.querySelectorAll(".tbl").forEach(el => el.classList.toggle("on", f.includes(el.dataset.t)));
    const markOn = li >= (s.data.markAt ?? 99);
    art.querySelectorAll(".mkc").forEach(el => el.classList.toggle("mk", markOn));
  }
  if (s.type === "diagram" && s.data.routes) {
    const dot = art.querySelector("#dot"), lab = art.querySelector("#dotl");
    const r = li >= 0 ? s.data.routes[li] : null;
    if (!r) { dot.style.opacity = 0; lab.style.opacity = 0; }
    else {
      const byId = Object.fromEntries(s.data.nodes.map(n => [n.id, [n.x + n.w / 2, n.y + n.h / 2]]));
      const p = clamp((lt - L[li].s) / Math.max(1.2, L[li].e - L[li].s));
      const seg = r.length - 1, f = Math.min(seg - 1e-6, ease(p) * seg), i = Math.floor(f), q = f - i;
      const a = byId[r[i]], b = byId[r[i + 1]];
      const x = a[0] + (b[0] - a[0]) * q, y = a[1] + (b[1] - a[1]) * q;
      dot.style.opacity = 1; dot.style.left = x + "px"; dot.style.top = y + "px";
      lab.textContent = (s.data.routeLabels || [])[li] || "";
      lab.style.opacity = lab.textContent ? 1 : 0; lab.style.left = x + "px"; lab.style.top = y + "px";
    }
  }
  art.querySelectorAll(".hand").forEach(h => h.setAttribute("transform", `rotate(${lt * 90} 50 50)`));

  // 字幕(面接カードと章の扉は、画面に文字があるので出さない)
  const noSub = s.type === "card" || s.type === "chapter";
  if (!noSub && li >= 0 && lt < s.end - s.start - .25) {
    subBox.style.opacity = 1;
    subEl.textContent = s.lines[li].sub;
    subEl.style.opacity = clamp((lt - L[li].s + .1) / .15);
  } else subBox.style.opacity = 0;
};

document.fonts.ready.then(() => {
  window.render(0);
  window.READY = true;
  if (!navigator.webdriver) {
    const t0 = performance.now();
    const tick = () => { const t = (performance.now() - t0) / 1000; if (t < T.total) { window.render(t); requestAnimationFrame(tick); } };
    requestAnimationFrame(tick);
  }
});
</script>
</body>
</html>
